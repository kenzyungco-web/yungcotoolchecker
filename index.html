<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💊💵 Customer Service Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP NAVIGATION -->
  <div class="topbar">
    <button id="homeBtn">💊💵 Home</button>
    <button id="darkModeBtn">🌙 Dark Mode</button>
  </div>

  <!-- HEADER -->
  <header>
    <h1>💊💵 Customer Service Tool</h1>

    <div class="datetime">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <!-- MONEYBACK GUARANTEE -->
    <section class="card">
      <h2>1. MoneyBack Guarantee Checker</h2>

      <label>Select Guarantee Days:</label>
      <select id="guaranteeType">
        <option value="60">60 Days</option>
        <option value="80">80 Days</option>
        <option value="180">180 Days</option>
      </select>

      <label>Order Date:</label>
      <input type="date" id="orderDate">

      <label>Present Date:</label>
      <input type="date" id="presentDate">

      <button onclick="checkGuarantee()">Check Status</button>

      <div class="result" id="guaranteeResult"></div>
    </section>

    <!-- AHT TIME CONVERTER -->
    <section class="card">
      <h2>2. AHT Time Converter</h2>

      <label>Input Seconds:</label>
      <input type="number" id="secondsInput" placeholder="Enter seconds">

      <button onclick="convertTime()">Convert Time</button>

      <div class="result" id="timeResult"></div>
    </section>

    <!-- REFUND CALCULATOR -->
    <section class="card">
      <h2>3. Refund Option Calculator</h2>

      <label>Product Amount ($):</label>
      <input type="number" id="productAmount" placeholder="Enter amount">

      <button onclick="calculateRefund()">Calculate Refund</button>

      <div class="result" id="refundResult"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
