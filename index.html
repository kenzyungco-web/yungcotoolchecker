<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utility Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Utility Tool</h1>

    <div class="top-buttons">
      <button id="darkModeBtn">🌙 Dark Mode</button>
      <button id="refreshBtn">🔄 Refresh</button>
    </div>
  </header>

  <nav class="nav-buttons">
    <button onclick="showSection('guarantee')">Guarantee Checker</button>
    <button onclick="showSection('discount')">Discount Calculator</button>
    <button onclick="showSection('refund')">Refund Tracker</button>
    <button onclick="showSection('aht')">AHT Converter</button>
  </nav>

  <main>

    <!-- Money Back Guarantee -->
    <section id="guarantee" class="tool-section active">
      <h2>Money Back Guarantee Checker</h2>

      <label>Order Date</label>
      <input type="date" id="orderDate">

      <label>Guarantee Days</label>
      <input type="number" id="guaranteeDays" placeholder="e.g. 30">

      <label>Today's Date</label>
      <input type="date" id="todayDate">

      <button onclick="checkGuarantee()">Check Guarantee</button>

      <div id="guaranteeResult" class="result"></div>
    </section>

    <!-- Discount Calculator -->
    <section id="discount" class="tool-section">
      <h2>Discount Calculator</h2>

      <label>Amount</label>
      <input type="number" id="discountAmount" placeholder="Enter amount">

      <button onclick="calculateDiscounts()">Calculate</button>

      <div id="discountResult" class="result"></div>
    </section>

    <!-- Refund Tracker -->
    <section id="refund" class="tool-section">
      <h2>Refund Timeframe Tracker</h2>

      <label>Refund Request Date</label>
      <input type="date" id="refundDate">

      <label>Processing Time</label>
      <select id="refundOption">
        <option value="3-5">3-5 Business Days</option>
        <option value="7-14">7-14 Business Days</option>
      </select>

      <button onclick="trackRefund()">Track Refund</button>

      <div id="refundResult" class="result"></div>
    </section>

    <!-- AHT Converter -->
    <section id="aht" class="tool-section">
      <h2>AHT Time Converter</h2>

      <label>Seconds</label>
      <input type="number" id="secondsInput" placeholder="Enter seconds">

      <button onclick="convertAHT()">Convert</button>

      <div id="ahtResult" class="result"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
