<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💊💵 Customer Service Tool</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="top-bar">
    <button id="homeBtn">💊💵 Home</button>
    <button id="darkModeToggle">🌙 Dark Mode</button>
  </div>

  <header>
    <h1>💊💵 Customer Service Tool</h1>
    <div class="datetime">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
  </header>

  <main>

    <!-- MoneyBack Guarantee Checker -->
    <section class="card">
      <h2>1. MoneyBack Guarantee Checker</h2>

      <label>Order Date:</label>
      <input type="date" id="orderDate">

      <label>Present Date:</label>
      <input type="date" id="presentDate">

      <button onclick="checkGuarantee()">Check Eligibility</button>

      <div class="result" id="guaranteeResult"></div>
    </section>

    <!-- AHT Time Converter -->
    <section class="card">
      <h2>2. AHT Time Converter</h2>

      <label>Enter Seconds:</label>
      <input type="number" id="secondsInput" placeholder="Example: 320">

      <button onclick="convertTime()">Convert</button>

      <div class="result" id="timeResult"></div>
    </section>

    <!-- Refund Option Calculator -->
    <section class="card">
      <h2>3. Refund Option Calculator</h2>

      <label>Product Amount ($):</label>
      <input type="number" id="productAmount" placeholder="Example: 120">

      <button onclick="calculateRefund()">Calculate Refunds</button>

      <div class="result" id="refundResult"></div>
    </section>

    <!-- Notations Format -->
    <section class="card">
      <h2>4. Notations Format</h2>

      <textarea id="notationBox" rows="18">
Agent Name:
Reason for Calling:
Resolution:
Offer Save:
Threat:
Status:
Campaign:
Email:
Name:
Phone:
Order ID:
Product:
RTN:
RMA:
      </textarea>

      <button onclick="copyNotation()">Copy Notes</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
