<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropShipping Coaching App</title>
<link rel="stylesheet" href="styles.css">
<script src="https://js.stripe.com/v3/"></script>
</head>

<body>

<!-- App Container -->
<div class="app">

    <!-- Header -->
    <div class="top-bar">
        <h2>KEN YUNGCO</h2>
        <span>📞 09198963548</span>
    </div>

    <!-- Main Screen -->
    <div class="screen">

        <h1>DropShipping Coaching</h1>
        <p>$25/month • 3 Sessions Monthly</p>

        <button onclick="showPayment()">Subscribe Now</button>
        <button onclick="showBooking()">Book Session</button>
        <button onclick="showAdmin()">Admin Dashboard</button>

        <!-- Payment Section -->
        <div id="paymentSection" class="hidden">
            <h3>Payment</h3>

            <select id="paymentMethod">
                <option>Credit Card</option>
                <option>Visa</option>
                <option>Debit Card</option>
                <option>Online Payment</option>
            </select>

            <input type="text" placeholder="Card Number">

            <button onclick="payNow()">Pay $25</button>
        </div>

        <!-- Booking Section -->
        <div id="bookingSection" class="hidden">
            <h3>Book Coaching Session</h3>

            <input type="text" id="clientName" placeholder="Your Name">
            <input type="date" id="sessionDate">

            <button onclick="bookSession()">Book</button>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminSection" class="hidden">
            <h3>Admin Dashboard</h3>

            <div id="bookingList"></div>
        </div>

    </div>

    <!-- Reviews -->
    <div class="reviews">
        <p>"Amazing coaching! I now earn online consistently!"</p>
        <p>"Best investment for learning dropshipping!"</p>
    </div>

    <!-- Footer -->
    <div class="footer">
        EARNING MONEY IS HARD BUT WHAT IS HARD IF YOU ARE SMART
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
