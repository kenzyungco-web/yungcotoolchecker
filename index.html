<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utility Tool</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <header class="topbar">
    <h1>Utility Tool</h1>
    <div class="topbar-actions">
      <button id="darkToggle">🌙 Dark Mode</button>
      <button onclick="location.reload()">🔄 Refresh</button>
    </div>
  </header>

  <main class="container">

    <!-- Money Back Guarantee Checker -->
    <section class="card">
      <h2>Money Back Guarantee Checker</h2>
      <input type="date" id="orderDate"/>
      <input type="number" id="guaranteedDays" placeholder="Guaranteed Days"/>
      <input type="date" id="todayDate"/>
      <button onclick="checkGuarantee()">Check</button>
      <p id="guaranteeResult"></p>
    </section>

    <!-- Discount Calculator -->
    <section class="card">
      <h2>Discount Calculator</h2>
      <input type="number" id="amount" placeholder="Enter Amount"/>
      <button onclick="calculateDiscount()">Calculate</button>
      <div id="discountResult"></div>
    </section>

    <!-- Refund Tracker -->
    <section class="card">
      <h2>Refund Timeframe Tracker</h2>
      <input type="date" id="refundDate"/>
      <select id="refundType">
        <option value="3-5">3-5 Business Days</option>
        <option value="7-14">7-14 Business Days</option>
      </select>
      <button onclick="calculateRefund()">Track</button>
      <p id="refundResult"></p>
    </section>

    <!-- AHT Converter -->
    <section class="card">
      <h2>AHT Time Converter</h2>
      <input type="number" id="secondsInput" placeholder="Seconds"/>
      <button onclick="convertTime()">Convert</button>
      <p id="ahtResult"></p>
    </section>

    <!-- Parcel Tracker -->
    <section class="card">
      <h2>Parcel Tracker</h2>
      <input type="text" id="address" placeholder="Delivery Address"/>
      <input type="text" id="latestUpdate" placeholder="Latest Update"/>
      <input type="date" id="deliveryDate"/>
      <button onclick="trackParcel()">Track</button>
      <p id="parcelResult"></p>
    </section>

    <!-- Realtime Clock -->
    <section class="card">
      <h2>Realtime Clock</h2>
      <h3 id="clock"></h3>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
