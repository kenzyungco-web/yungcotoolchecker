<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <title>Customer Dashboard</title>
 
  <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
  <!-- HEADER -->
<header>
<h1>Customer Service Utility Dashboard</h1>
 
    <div class="top-bar">
<div id="clock">00:00:00</div>
 
      <button id="darkBtn">
        Dark Mode
</button>
</div>
</header>
 
  <!-- DASHBOARD -->
<div class="dashboard">
 
    <!-- MONEYBACK -->
<div class="card">
 
      <h2>Moneyback Guarantee Checker</h2>
 
      <input type="date" id="purchaseDate">
 
      <input type="number" id="days" placeholder="Guarantee Days">
 
      <button onclick="checkGuarantee()">
        Check
</button>
 
      <div id="guaranteeResult"></div>
 
    </div>
 
    <!-- AHT -->
<div class="card">
 
      <h2>AHT Time Converter</h2>
 
      <input type="number" id="seconds" placeholder="Enter Seconds">
 
      <button onclick="convertTime()">
        Convert
</button>
 
      <div id="timeResult"></div>
 
    </div>
 
    <!-- REFUND -->
<div class="card">
 
      <h2>Refund Calculator</h2>
 
      <input type="number" id="price" placeholder="Product Price">
 
      <input type="number" id="percent" placeholder="Refund %">
 
      <input type="number" id="fee" placeholder="Processing Fee">
 
      <button onclick="calculateRefund()">
        Calculate
</button>
 
      <div id="refundResult"></div>
 
    </div>
 
    <!-- PRODUCT -->
<div class="card">
 
      <h2>Product Search</h2>
 
      <input type="text" id="productSearch" placeholder="Product Name or ID">
 
      <button onclick="searchProduct()">
        Search
</button>
 
      <div id="productResult"></div>
 
    </div>
 
  </div>
 
  <script src="script.js"></script>
 
</body>
</html>
