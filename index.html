<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🎧 Customer Service Tool</h1>

        <!-- Clock -->
        <div class="card">
            <h2>🕒 Real-Time Clock</h2>
            <div id="clock"></div>
            <div id="date"></div>
        </div>

        <!-- Money Back Guarantee Checker -->
        <div class="card">
            <h2>💰 Money Back Guarantee Checker</h2>

            <label>Order Date:</label>
            <input type="date" id="orderDate">

            <label>Select Guarantee:</label>
            <select id="guaranteeDays">
                <option value="60">60 Days</option>
                <option value="80">80 Days</option>
                <option value="180">180 Days</option>
            </select>

            <button onclick="checkGuarantee()">Check Eligibility</button>

            <p id="guaranteeResult"></p>
        </div>

        <!-- AHT Converter -->
        <div class="card">
            <h2>⏳ AHT Time Converter</h2>

            <input type="number" id="secondsInput" placeholder="Enter seconds">

            <button onclick="convertTime()">Convert</button>

            <p id="convertedTime"></p>
        </div>

        <!-- Refund Ladder -->
        <div class="card">
            <h2>💸 Refund Ladder Calculator</h2>

            <input type="number" id="productAmount" placeholder="Enter product amount">

            <button onclick="calculateRefund()">Calculate Refund</button>

            <div id="refundResults"></div>
        </div>

        <!-- Stopwatch -->
        <div class="card">
            <h2>⏱️ Stopwatch</h2>

            <div id="stopwatch">00:00:00</div>

            <div class="stopwatch-buttons">
                <button onclick="startStopwatch()">Start</button>
                <button onclick="stopStopwatch()">Stop</button>
                <button onclick="resetStopwatch()">Reset</button>
            </div>
        </div>

        <!-- Controls -->
        <div class="card controls">
            <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
            <button onclick="refreshPage()">🔄 Refresh</button>
        </div>

        <!-- Quote -->
        <div class="quote">
            AYAW KOL BATA PAKO KOL PATOTOYA
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
