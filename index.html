<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utility Tool</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="left">
      <span class="cat">🐱</span>
      <div class="clock" id="clock">--:--:--</div>
    </div>

    <div class="right">
      <button id="darkToggle">🌙</button>
      <button onclick="location.reload()">⟳</button>
    </div>
  </div>

  <!-- Home -->
  <div class="section active" id="home">
    <h1>Utility Tool</h1>
    <div class="grid">
      <button onclick="showSection('guarantee')">Money Back Guarantee Checker</button>
      <button onclick="showSection('discount')">Discount Calculator</button>
      <button onclick="showSection('refund')">Refund Timeframe Tracker</button>
      <button onclick="showSection('aht')">AHT Time Converter</button>
      <button onclick="showSection('notation')">Notations Format</button>
    </div>
  </div>

  <!-- Guarantee Checker -->
  <div class="section" id="guarantee">
    <h2>Money Back Guarantee Checker</h2>

    <input type="date" id="orderDate">
    <input type="number" id="guaranteeDays" placeholder="Guarantee Days">
    <input type="date" id="todayDate">

    <button onclick="checkGuarantee()">Check</button>

    <div class="output" id="guaranteeOutput"></div>
    <button class="back" onclick="showSection('home')">Back to Home</button>
  </div>

  <!-- Discount -->
  <div class="section" id="discount">
    <h2>Discount Calculator</h2>

    <input type="number" id="amount" placeholder="Enter amount">
    <button onclick="calculateDiscount()">Calculate</button>

    <div class="output" id="discountOutput"></div>
    <button class="back" onclick="showSection('home')">Back to Home</button>
  </div>

  <!-- Refund -->
  <div class="section" id="refund">
    <h2>Refund Timeframe Tracker</h2>

    <input type="date" id="refundDate">
    <select id="refundRange">
      <option value="3-5">3-5 Business Days</option>
      <option value="7-14">7-14 Business Days</option>
    </select>

    <button onclick="calculateRefund()">Calculate</button>

    <div class="output" id="refundOutput"></div>
    <button class="back" onclick="showSection('home')">Back to Home</button>
  </div>

  <!-- AHT -->
  <div class="section" id="aht">
    <h2>AHT Time Converter</h2>

    <input type="number" id="secondsInput" placeholder="Seconds">
    <button onclick="convertTime()">Convert</button>

    <div class="output" id="ahtOutput"></div>
    <button class="back" onclick="showSection('home')">Back to Home</button>
  </div>

  <!-- Notation -->
  <div class="section" id="notation">
    <h2>Notations Format</h2>

    <div class="btn-row">
      <button onclick="setTemplate(1)">Type 1</button>
      <button onclick="setTemplate(2)">Type 2</button>
      <button onclick="setTemplate(3)">Type 3</button>
      <button onclick="copyText()">Copy</button>
    </div>

    <textarea id="notationBox"></textarea>

    <button class="back" onclick="showSection('home')">Back to Home</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
