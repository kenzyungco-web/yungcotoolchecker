<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💊💵 Customer Service Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP NAV -->
  <div class="topbar">
    <button id="homeBtn">💊💵 Home</button>
    <button id="darkModeBtn">🌙 Dark Mode</button>
  </div>

  <!-- HEADER -->
  <header>
    <h1>💊💵 Customer Service Tool</h1>

    <div class="datetime">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
  </header>

  <main>

    <!-- MONEYBACK CHECKER -->
    <section class="card">
      <h2>1. MoneyBack Guarantee Checker</h2>

      <label>Order Date:</label>
      <input type="date" id="orderDate">

      <label>Present Date:</label>
      <input type="date" id="presentDate">

      <button onclick="checkGuarantee()">Check Status</button>

      <div id="guaranteeResult" class="result"></div>
    </section>

    <!-- AHT CONVERTER -->
    <section class="card">
      <h2>2. AHT Time Converter</h2>

      <label>Enter Seconds:</label>
      <input type="number" id="secondsInput" placeholder="Enter seconds">

      <button onclick="convertTime()">Convert Time</button>

      <div id="timeResult" class="result"></div>
    </section>

    <!-- REFUND CALCULATOR -->
    <section class="card">
      <h2>3. Refund Option Calculator</h2>

      <label>Product Amount ($):</label>
      <input type="number" id="productAmount" placeholder="Enter amount">

      <button onclick="calculateRefund()">Calculate Refund</button>

      <div id="refundResult" class="result"></div>
    </section>

    <!-- NOTATIONS -->
    <section class="card notation-card">
      <h2>4. Notations Format</h2>

      <textarea id="notationBox" rows="16">
Agent Name:
Reason for Calling:
Resolution:
Offer Save:
Threat:
Status:
Campaign:
Email:
Name:
Phone:
Order ID:
Product:
RTN:
RMA:
      </textarea>

      <button onclick="copyNotation()">Copy Notes</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
