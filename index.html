<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Tool</title>

    <!-- ✅ CORRECT CSS LINK -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="light">

<h1>Utility Tool Dashboard</h1>

<div class="card">
    <h2>Theme Selector</h2>
    <select id="themeSelect">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="blue">Blue</option>
        <option value="neon">Neon</option>
    </select>
    <input type="color" id="colorPicker">
</div>

<div class="card">
    <h2>Moneyback Checker</h2>
    <input type="date" id="orderDate">
    <select id="validity">
        <option value="60">60 Days</option>
        <option value="90">90 Days</option>
        <option value="180">180 Days</option>
    </select>
    <button onclick="checkEligibility()">Check</button>
    <p id="mbResult"></p>
</div>

<div class="card">
    <h2>Refund Calculator</h2>
    <input type="number" id="amount" placeholder="Enter amount">
    <select id="refundPercent">
        <option value="10">10%</option>
        <option value="15">15%</option>
        <option value="20">20%</option>
        <option value="35">35%</option>
        <option value="50">50%</option>
    </select>
    <button onclick="calculateRefund()">Calculate</button>
    <p id="refundResult"></p>
</div>

<div class="card">
    <h2>AHT Converter</h2>
    <input type="number" id="seconds" placeholder="Enter seconds">
    <button onclick="convertTime()">Convert</button>
    <p id="timeResult"></p>
</div>

<div class="card">
    <h2>World Clock</h2>
    <select id="timezone">
        <option value="Asia/Manila">Philippines</option>
        <option value="UTC">UTC</option>
        <option value="America/New_York">New York</option>
        <option value="Europe/London">London</option>
    </select>
    <p id="clock"></p>
</div>

<!-- ✅ CORRECT JS LINK -->
<script src="script.js"></script>

</body>
</html>
