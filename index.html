<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🎧 Customer Service Tool</h1>

            <div class="datetime">
                <p id="clock">00:00:00</p>
                <p id="date">Loading date...</p>
            </div>

            <div class="top-buttons">
                <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
                <button onclick="goBack()">🔙 Go Back</button>
            </div>
        </header>

        <!-- Money Back Guarantee Checker -->
        <section class="card">
            <h2>💰 Money Back Guarantee Checker</h2>

            <label>Order Date:</label>
            <input type="date" id="orderDate">

            <label>Guarantee Period:</label>
            <select id="guaranteeDays">
                <option value="60">60 Days</option>
                <option value="80">80 Days</option>
                <option value="180">180 Days</option>
            </select>

            <button onclick="checkGuarantee()">Check Eligibility</button>

            <div id="guaranteeResult" class="result"></div>
        </section>

        <!-- AHT Time Converter -->
        <section class="card">
            <h2>⏱️ AHT Time Converter</h2>

            <label>Enter Seconds:</label>
            <input type="number" id="secondsInput" placeholder="e.g. 350">

            <button onclick="convertTime()">Convert</button>

            <div id="timeResult" class="result"></div>
        </section>

        <!-- Refund Ladder Calculator -->
        <section class="card">
            <h2>📉 Refund Ladder Calculator</h2>

            <label>Product Amount ($):</label>
            <input type="number" id="productAmount" placeholder="Enter amount">

            <button onclick="calculateRefunds()">Calculate Refunds</button>

            <div id="refundResult" class="result"></div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
